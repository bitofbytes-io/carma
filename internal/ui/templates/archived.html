{{define "content"}}
<section class="card">
  <div class="section-head">
    <h1>Archived vehicles</h1>
    <a class="secondary" href="/">Back to garage</a>
  </div>
  <div class="vehicle-grid">
    {{range .Vehicles}}
      <div class="vehicle-card">
        <a class="vehicle-link" href="/vehicles/{{.ID}}">
          <div class="vehicle-body">
            <h2>{{.Nickname}}</h2>
            <p>{{if .Year}}{{.Year}}{{end}} {{.Make}} {{.Model}}</p>
          </div>
        </a>
        <form class="restore-form" method="post" action="/vehicles/{{.ID}}/restore" hx-post="/vehicles/{{.ID}}/restore">
          <button class="secondary">Restore</button>
        </form>
      </div>
    {{else}}
      <p>No archived vehicles.</p>
    {{end}}
  </div>
</section>
{{end}}
