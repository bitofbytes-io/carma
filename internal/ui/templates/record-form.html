{{define "content"}}<section class="card form-card">
<h1>{{if .Editing}}Edit record{{else}}Add record{{end}} · {{.Vehicle.Nickname}}</h1>{{if .Error}}<div class="error">{{.Error}}</div>{{end}}
<form method="post" {{if not .Editing}}enctype="multipart/form-data"{{end}} action="{{if .Editing}}/records/{{.Record.ID}}{{else}}/vehicles/{{.Vehicle.ID}}/records{{end}}" class="form-grid">
  <label>Date <input type="date" name="occurred_on" required value="{{iso .Record.OccurredOn}}"></label>
  <label>Service type <select name="service_type_id" required>{{range .Types}}<option value="{{.ID}}" {{selected .ID $.Record.ServiceTypeID}}>{{.Name}}</option>{{end}}</select></label>
  <label>Odometer (mi) <input type="number" inputmode="numeric" min="0" name="odometer" value="{{if .Record.OdometerMiles}}{{.Record.OdometerMiles}}{{end}}"></label>
  <label>Cost <input inputmode="decimal" name="cost" placeholder="89.00" value="{{if .Record.CostCents}}{{money .Record.CostCents}}{{end}}"></label>
  <label>Vendor <input name="vendor" value="{{.Record.Vendor}}"></label><label class="full">Notes <textarea name="notes">{{.Record.Notes}}</textarea></label>
  {{if not .Editing}}<label class="full upload">Receipts <input type="file" name="receipts" multiple accept="application/pdf,image/jpeg,image/png,image/webp,image/heic" capture="environment"><small>PDF, JPEG, PNG, WebP, or HEIC · 25 MiB each. On a phone you can use the camera.</small></label>{{end}}
  <div class="actions full"><a class="secondary" href="{{if .Editing}}/records/{{.Record.ID}}{{else}}/vehicles/{{.Vehicle.ID}}{{end}}">Cancel</a><button class="primary">Save record</button></div>
</form><hr>
<form method="post" action="/service-types" class="inline-form"><input type="hidden" name="return_to" value="{{if .Editing}}/records/{{.Record.ID}}/edit{{else}}/vehicles/{{.Vehicle.ID}}/records/new{{end}}"><label>Need another type? <input name="name" required placeholder="Custom service type"></label><button class="secondary">Add type</button></form>
</section>{{end}}
