{{define "content"}}<section class="card form-card"><h1>{{if .Editing}}Edit vehicle{{else}}Add vehicle{{end}}</h1>{{if .Error}}<div class="error">{{.Error}}</div>{{end}}
<form method="post" enctype="multipart/form-data" action="{{if .Editing}}/vehicles/{{.Vehicle.ID}}{{else}}/vehicles{{end}}" class="form-grid"><label>Nickname <input name="nickname" required value="{{.Vehicle.Nickname}}"></label><label>Year <input type="number" name="year" min="1886" max="9999" value="{{if .Vehicle.Year}}{{.Vehicle.Year}}{{end}}"></label><label>Make <input name="make" value="{{.Vehicle.Make}}"></label><label>Model <input name="model" value="{{.Vehicle.Model}}"></label><label>VIN <input name="vin" value="{{.Vehicle.VIN}}"></label><label>License plate <input name="license_plate" value="{{.Vehicle.LicensePlate}}"></label><label class="full">Photo <input type="file" name="photo" accept="image/jpeg,image/png,image/webp,image/heic" capture="environment"></label><label class="full">Notes <textarea name="notes">{{.Vehicle.Notes}}</textarea></label><div class="actions full"><a class="secondary" href="{{if .Editing}}/vehicles/{{.Vehicle.ID}}{{else}}/{{end}}">Cancel</a><button class="primary">Save vehicle</button></div></form>
{{if .Editing}}{{if not .Vehicle.ArchivedAt}}<form method="post" action="/vehicles/{{.Vehicle.ID}}/archive" class="danger-zone" hx-confirm="Archive this vehicle?"><button class="danger">Archive vehicle</button></form>{{end}}{{end}}</section>{{end}}
