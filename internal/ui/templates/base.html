{{define "base"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>{{if .Title}}{{.Title}} · {{end}}Carma</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/reminders.css"><script src="/static/htmx.min.js" defer></script></head><body>
{{if .Authenticated}}<header class="topbar" hx-boost="true"><a class="wordmark" href="/">CARMA</a><select class="vehicle-switch" aria-label="Choose vehicle" onchange="if(this.value) location.href=this.value"><option value="/">All vehicles</option>{{range .NavVehicles}}<option value="/vehicles/{{.ID}}">{{.Nickname}}</option>{{end}}</select><div class="account"><span>{{.User.DisplayName}}</span><form method="post" action="/logout"><button class="link" type="submit">Sign out</button></form></div></header>{{end}}
<main class="shell">{{if .Flash}}<div class="alert">{{.Flash}}</div>{{end}}{{template "content" .}}</main></body></html>{{end}}
