version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - gosec
    - bodyclose
  exclusions:
    generated: strict
    presets: []
    rules:
      # Test fixtures build bare cookies, relaxed file modes and subprocesses on purpose.
      - path: _test\.go
        linters:
          - gosec
formatters:
  enable:
    - gofmt
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
