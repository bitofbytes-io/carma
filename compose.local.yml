services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: carma
      POSTGRES_PASSWORD: carma
      POSTGRES_DB: carma
    ports:
      - "5435:5432"
    volumes:
      - carma_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carma -d carma"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  carma_postgres:
